<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>汉字笔顺临摹</title>
<meta name="description" content="输入任意汉字，逐笔展示笔顺书写顺序，支持临摹练习">
<meta name="theme-color" content="#c0392b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="笔顺临摹">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cnchar/cnchar.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Noto Serif SC", "SimSun", "STSong", serif;
    background: #f5f0e8;
    color: #2c2c2c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  header {
    width: 100%;
    background: linear-gradient(135deg, #8b1a1a, #c0392b);
    color: #fff;
    text-align: center;
    padding: 18px 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  header h1 { font-size: 24px; font-weight: 700; letter-spacing: 6px; }
  header p { margin-top: 4px; font-size: 13px; opacity: 0.85; letter-spacing: 2px; }

  .input-section {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .input-section input {
    font-size: 22px;
    padding: 10px 16px;
    width: 120px;
    text-align: center;
    border: 2px solid #c0392b;
    border-radius: 8px;
    background: #fffdf7;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-section input:focus {
    border-color: #8b1a1a;
    box-shadow: 0 0 0 3px rgba(192,57,43,0.15);
  }

  .pinyin-card {
    margin-bottom: 8px;
    background: #fffdf7;
    border: 2px solid #d4a574;
    border-radius: 12px;
    padding: 10px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: none;
    text-align: center;
    width: 300px;
  }

  .pinyin-card.show { display: block; }

  .pinyin-full {
    font-size: 32px;
    color: #c0392b;
    font-weight: 700;
    letter-spacing: 3px;
    font-family: "Georgia", "Times New Roman", serif;
  }

  .pinyin-parts {
    margin-top: 8px;
    display: flex;
    gap: 0;
    justify-content: center;
  }

  .pinyin-part {
    padding: 6px 14px;
    text-align: center;
  }

  .pinyin-part + .pinyin-part {
    border-left: 1px dashed #d4a574;
  }

  .pinyin-part-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 2px;
  }

  .pinyin-part-value {
    font-size: 22px;
    font-weight: 700;
    color: #2c2c2c;
    font-family: "Georgia", "Times New Roman", serif;
    min-width: 28px;
  }

  .pinyin-part-value.sm { font-size: 16px; }

  .pinyin-tone-symbol {
    font-size: 28px;
    line-height: 1;
    color: #c0392b;
  }

  .pinyin-tone-name {
    font-size: 12px;
    color: #c0392b;
    margin-top: 1px;
  }

  .btn {
    font-size: 14px;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 600;
    letter-spacing: 1px;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  .btn-primary { background: #c0392b; color: #fff; }
  .btn-primary:hover { background: #8b1a1a; }

  .btn-secondary { background: #fff; color: #c0392b; border: 2px solid #c0392b; }
  .btn-secondary:hover { background: #fce4e4; }

  .btn-step {
    background: #fff;
    color: #c0392b;
    border: 2px solid #c0392b;
    width: 44px;
    height: 44px;
    padding: 0;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .btn-step:hover { background: #fce4e4; }

  /* Main content: writer + sidebar */
  .main-content {
    margin-top: 12px;
    display: flex;
    gap: 20px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    max-width: 800px;
    padding: 0 16px;
  }

  .left-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .writer-wrapper {
    position: relative;
    width: 300px;
    height: 300px;
    border: 3px solid #d4a574;
    border-radius: 4px;
    background: #fff;
    overflow: hidden;
  }

  .writer-wrapper svg.main-svg {
    width: 100%;
    height: 100%;
  }

  .writer-wrapper svg.main-svg line.grid-line {
    stroke: #e0c9a8;
    stroke-width: 1;
    stroke-dasharray: 6, 4;
  }

  .writer-wrapper svg.main-svg .stroke-path {
    fill-opacity: 0;
    transition: fill-opacity 0.3s ease;
  }

  .writer-wrapper svg.main-svg .stroke-path.visible {
    fill-opacity: 1;
  }

  .placeholder {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-size: 18px;
    letter-spacing: 4px;
    z-index: 3;
    pointer-events: none;
  }

  /* Quiz overlay */
  .quiz-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    display: none;
  }

  .quiz-overlay .writer-target {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .quiz-overlay .grid-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .quiz-overlay .grid-overlay line {
    stroke: #e0c9a8;
    stroke-width: 1;
    stroke-dasharray: 6, 4;
  }

  /* Step controls */
  .step-controls {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .step-display {
    font-size: 18px;
    font-weight: 700;
    color: #c0392b;
    min-width: 64px;
    text-align: center;
  }

  /* Mode controls */
  .mode-controls {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .speed-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #666;
  }

  .speed-control input[type="range"] {
    width: 80px;
    accent-color: #c0392b;
  }

  /* Right panel: stroke breakdown */
  .right-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .right-panel h3 {
    font-size: 14px;
    color: #8b1a1a;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .strokes-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 220px;
  }

  .stroke-item {
    background: #fffdf7;
    border: 2px solid #e0c9a8;
    border-radius: 8px;
    padding: 3px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }

  .stroke-item:hover { border-color: #c0392b; }

  .stroke-item.active {
    border-color: #c0392b;
    box-shadow: 0 0 8px rgba(192,57,43,0.3);
  }

  .stroke-item .stroke-num {
    font-size: 10px;
    color: #999;
    line-height: 1;
    margin-bottom: 1px;
  }

  /* Char history */
  .char-history {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 700px;
  }

  .char-history-item {
    width: 44px;
    height: 44px;
    border: 2px solid #d4a574;
    border-radius: 6px;
    background: #fffdf7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-user-select: none;
    user-select: none;
  }

  .char-history-item:hover { border-color: #c0392b; transform: scale(1.1); }
  .char-history-item:active { transform: scale(0.95); }

  footer {
    margin-top: auto;
    padding: 16px;
    text-align: center;
    font-size: 12px;
    color: #aaa;
  }

  @media (max-width: 700px) {
    header h1 { font-size: 20px; }
    header { padding: 12px; }

    .main-content {
      flex-direction: column;
      align-items: center;
    }

    .writer-wrapper {
      width: min(280px, calc(100vw - 48px));
      height: min(280px, calc(100vw - 48px));
    }

    .pinyin-card {
      width: min(280px, calc(100vw - 48px));
    }

    .right-panel {
      width: 100%;
    }

    .right-panel h3 { margin-bottom: 6px; }

    .strokes-grid {
      max-width: none;
      width: 100%;
      justify-content: center;
    }

    .btn { font-size: 13px; padding: 6px 12px; }
    .input-section input { font-size: 18px; width: 100px; }

    .pinyin-card { padding: 10px 14px; }
    .pinyin-full { font-size: 26px; }
    .pinyin-part { padding: 5px 10px; }
    .pinyin-part-value { font-size: 18px; }
    .pinyin-tone-symbol { font-size: 22px; }
  }

  .writer-wrapper, .btn, .char-history-item, .stroke-item {
    -webkit-touch-callout: none;
  }
</style>
</head>
<body>

<header>
  <h1>汉字笔顺临摹</h1>
  <p>输入汉字，逐笔展示书写顺序</p>
</header>

<div class="input-section">
  <input type="text" id="charInput" maxlength="1" placeholder="输入汉字" />
  <button class="btn btn-primary" onclick="loadChar()">开始</button>
</div>

<div class="main-content">
  <div class="left-panel">
    <div class="pinyin-card" id="pinyinCard">
      <div class="pinyin-full" id="pinyinFull"></div>
      <div class="pinyin-parts" id="pinyinParts"></div>
    </div>
    <div class="writer-wrapper" id="writerWrapper">
      <svg class="main-svg" id="mainSvg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <line class="grid-line" x1="150" y1="0" x2="150" y2="300"/>
        <line class="grid-line" x1="0" y1="150" x2="300" y2="150"/>
        <line class="grid-line" x1="0" y1="0" x2="300" y2="300"/>
        <line class="grid-line" x1="300" y1="0" x2="0" y2="300"/>
      </svg>
      <div class="placeholder" id="mainPlaceholder">请输入汉字</div>
      <div class="quiz-overlay" id="quizOverlay">
        <div class="writer-target" id="quizWriter"></div>
        <svg class="grid-overlay" viewBox="0 0 300 300" preserveAspectRatio="none">
          <line x1="150" y1="0" x2="150" y2="300"/>
          <line x1="0" y1="150" x2="300" y2="150"/>
          <line x1="0" y1="0" x2="300" y2="300"/>
          <line x1="300" y1="0" x2="0" y2="300"/>
        </svg>
      </div>
    </div>

    <div class="step-controls">
      <button class="btn btn-step" id="prevBtn" onclick="prevStep()" disabled>◀</button>
      <span class="step-display" id="stepDisplay">-</span>
      <button class="btn btn-step" id="nextBtn" onclick="nextStep()" disabled>▶</button>
    </div>

    <div class="mode-controls">
      <button class="btn btn-secondary" id="playBtn" onclick="toggleAutoPlay()">▶ 播放</button>
      <div class="speed-control">
        <span>速度</span>
        <input type="range" id="speedSlider" min="0.5" max="3" step="0.25" value="1" />
        <span id="speedLabel">1x</span>
      </div>
      <button class="btn btn-secondary" onclick="quizMode()">临摹</button>
      <button class="btn btn-secondary" onclick="resetWriter()">重置</button>
    </div>
  </div>

  <div class="right-panel" id="strokeBreakdown" style="display:none;">
    <h3>逐笔分解</h3>
    <div class="strokes-grid" id="strokesGrid"></div>
  </div>
</div>

<div class="char-history" id="charHistory"></div>

<footer>笔顺数据来源：hanzi-writer / Make Me a Hanzi</footer>

<script>
const SIZE = 300;
const PAD = 20;
const DRAW_SIZE = SIZE - PAD * 2;
const ORIG_SIZE = 1024;
const SCALE = DRAW_SIZE / ORIG_SIZE;

let currentChar = '';
let strokeData = null;
let currentStep = -1;
let totalStrokes = 0;
let isAutoPlaying = false;
let autoPlayTimer = null;
let quizWriter = null;
let isQuizMode = false;
const history = [];

const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
speedSlider.addEventListener('input', () => {
  speedLabel.textContent = speedSlider.value + 'x';
});

function getSpeed() { return parseFloat(speedSlider.value); }
function getDelay() { return Math.round(800 / getSpeed()); }

function getPinyin(char) {
  try {
    if (typeof cnchar !== 'undefined' && cnchar.spell) {
      return cnchar.spell(char, 'tone', 'low');
    }
  } catch(e) {}
  return '';
}

// Parse pinyin into initial, final, tone
const INITIALS = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
const TONE_MAP = {
  'ā':'1','á':'2','ǎ':'3','à':'4',
  'ē':'1','é':'2','ě':'3','è':'4',
  'ī':'1','í':'2','ǐ':'3','ì':'4',
  'ō':'1','ó':'2','ǒ':'3','ò':'4',
  'ū':'1','ú':'2','ǔ':'3','ù':'4',
  'ǖ':'1','ǘ':'2','ǚ':'3','ǜ':'4',
};
const TONE_MARKS = { '1':'ˉ', '2':'ˊ', '3':'ˇ', '4':'ˋ' };
const TONE_NAMES = { '1':'一声', '2':'二声', '3':'三声', '4':'四声', '5':'轻声' };
const ACCENTED = 'āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ';

function parsePinyin(py) {
  if (!py) return null;
  let tone = '5';
  let base = '';
  for (let i = 0; i < py.length; i++) {
    const ch = py[i];
    const ti = ACCENTED.indexOf(ch);
    if (ti >= 0) {
      tone = TONE_MAP[ch];
      // Map accented vowel back to plain vowel
      const group = Math.floor(ti / 4);
      const plain = 'aeiouü'[group];
      base += plain;
    } else {
      base += ch;
    }
  }
  let initial = '';
  let final = base;
  for (const ini of INITIALS) {
    if (base.startsWith(ini)) {
      initial = ini;
      final = base.slice(ini.length);
      break;
    }
  }
  return { initial, final, tone, full: py };
}

function showPinyinCard(char) {
  const py = getPinyin(char);
  const card = document.getElementById('pinyinCard');
  if (!py) {
    card.classList.remove('show');
    return;
  }
  const parsed = parsePinyin(py);
  if (!parsed) {
    card.classList.remove('show');
    return;
  }

  document.getElementById('pinyinFull').textContent = parsed.full;

  const parts = document.getElementById('pinyinParts');
  parts.innerHTML = '';

  // 声母
  const iniPart = document.createElement('div');
  iniPart.className = 'pinyin-part';
  iniPart.innerHTML =
    '<div class="pinyin-part-label">声母</div>'
    + '<div class="pinyin-part-value' + (parsed.initial.length > 1 ? ' sm' : '') + '">' + (parsed.initial || '—') + '</div>';
  parts.appendChild(iniPart);

  // 韵母
  const finalPart = document.createElement('div');
  finalPart.className = 'pinyin-part';
  finalPart.innerHTML =
    '<div class="pinyin-part-label">韵母</div>'
    + '<div class="pinyin-part-value' + (parsed.final.length > 2 ? ' sm' : '') + '">' + parsed.final + '</div>';
  parts.appendChild(finalPart);

  // 声调
  const tonePart = document.createElement('div');
  tonePart.className = 'pinyin-part';
  const toneSymbol = TONE_MARKS[parsed.tone] || '';
  const toneName = TONE_NAMES[parsed.tone] || '';
  tonePart.innerHTML =
    '<div class="pinyin-part-label">声调</div>'
    + '<div class="pinyin-tone-symbol">' + (toneSymbol || '·') + '</div>'
    + '<div class="pinyin-tone-name">' + toneName + '</div>';
  parts.appendChild(tonePart);

  card.classList.add('show');
}

function loadChar() {
  const input = document.getElementById('charInput').value.trim();
  if (!input) return;
  const char = input[0];
  if (!/[\u4e00-\u9fff]/.test(char)) return;

  // Same character: restart animation
  if (char === currentChar && strokeData) {
    stopAutoPlay();
    exitQuizMode();
    currentStep = -1;
    clearMainSvg();
    updateStepDisplay();
    startAutoPlay();
    return;
  }

  // New character
  stopAutoPlay();
  exitQuizMode();
  currentChar = char;
  currentStep = -1;
  strokeData = null;
  totalStrokes = 0;

  document.getElementById('mainPlaceholder').style.display = 'none';
  showPinyinCard(char);
  clearMainSvg();
  updateStepDisplay();
  document.getElementById('strokeBreakdown').style.display = 'none';
  document.getElementById('strokesGrid').innerHTML = '';

  HanziWriter.loadCharacterData(char).then(data => {
    strokeData = data;
    totalStrokes = data.strokes.length;
    showStrokeBreakdown(data);
    updateStepDisplay();
    startAutoPlay();
  }).catch(() => {
    document.getElementById('pinyinCard').classList.remove('show');
    document.getElementById('pinyinCard').querySelector('.pinyin-full').textContent = '未找到笔顺数据';
    document.getElementById('pinyinCard').classList.add('show');
    strokeData = null;
  });

  if (!history.includes(char)) {
    history.push(char);
    renderHistory();
  }
}

function clearMainSvg() {
  const svg = document.getElementById('mainSvg');
  while (svg.childNodes.length > 4) {
    svg.removeChild(svg.lastChild);
  }
}

function renderMainWriter(animate) {
  clearMainSvg();
  if (!strokeData || currentStep < 0) return;

  const svg = document.getElementById('mainSvg');
  const transform = 'translate(' + PAD + ',' + PAD + ') scale(' + SCALE + ') translate(0,' + ORIG_SIZE + ') scale(1,-1)';

  for (let i = 0; i <= currentStep && i < totalStrokes; i++) {
    const isCurrent = (i === currentStep);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', strokeData.strokes[i]);
    path.setAttribute('class', 'stroke-path');
    path.setAttribute('transform', transform);
    path.setAttribute('fill', isCurrent ? '#c0392b' : '#2c2c2c');
    svg.appendChild(path);

    if (isCurrent && animate) {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          path.classList.add('visible');
        });
      });
    } else {
      path.classList.add('visible');
    }
  }
}

function renderComplete() {
  clearMainSvg();
  if (!strokeData) return;
  const svg = document.getElementById('mainSvg');
  const transform = 'translate(' + PAD + ',' + PAD + ') scale(' + SCALE + ') translate(0,' + ORIG_SIZE + ') scale(1,-1)';
  for (let i = 0; i < totalStrokes; i++) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', strokeData.strokes[i]);
    path.setAttribute('class', 'stroke-path visible');
    path.setAttribute('transform', transform);
    path.setAttribute('fill', '#2c2c2c');
    svg.appendChild(path);
  }
}

function nextStep() {
  if (!strokeData || currentStep >= totalStrokes - 1) return;
  currentStep++;
  renderMainWriter(true);
  highlightStrokeItem(currentStep);
  updateStepDisplay();
}

function prevStep() {
  if (currentStep < 0) return;
  currentStep--;
  renderMainWriter(false);
  highlightStrokeItem(currentStep);
  updateStepDisplay();
}

function jumpToStep(step) {
  if (!strokeData || step < -1 || step >= totalStrokes) return;
  stopAutoPlay();
  currentStep = step;
  renderMainWriter(false);
  highlightStrokeItem(currentStep);
  updateStepDisplay();
}

function startAutoPlay() {
  if (isAutoPlaying || !strokeData) return;
  isAutoPlaying = true;
  updatePlayButton();

  if (currentStep >= totalStrokes - 1) {
    currentStep = -1;
    clearMainSvg();
  }

  autoPlayStep();
}

function autoPlayStep() {
  if (!isAutoPlaying) return;
  if (currentStep >= totalStrokes - 1) {
    stopAutoPlay();
    // After last stroke shown, briefly show it in red, then switch to complete
    setTimeout(() => {
      renderComplete();
      highlightStrokeItem(-1);
    }, Math.round(getDelay() * 0.6));
    return;
  }
  nextStep();
  autoPlayTimer = setTimeout(autoPlayStep, getDelay());
}

function stopAutoPlay() {
  isAutoPlaying = false;
  if (autoPlayTimer) {
    clearTimeout(autoPlayTimer);
    autoPlayTimer = null;
  }
  updatePlayButton();
}

function toggleAutoPlay() {
  if (isAutoPlaying) {
    stopAutoPlay();
  } else {
    startAutoPlay();
  }
}

function updatePlayButton() {
  const btn = document.getElementById('playBtn');
  btn.textContent = isAutoPlaying ? '⏸ 暂停' : '▶ 播放';
}

function updateStepDisplay() {
  const display = document.getElementById('stepDisplay');
  if (!strokeData) {
    display.textContent = '-';
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  display.textContent = (currentStep + 1) + ' / ' + totalStrokes;
  document.getElementById('prevBtn').disabled = (currentStep < 0);
  document.getElementById('nextBtn').disabled = (currentStep >= totalStrokes - 1);
}

function showStrokeBreakdown(data) {
  if (!data || !data.strokes) return;
  const grid = document.getElementById('strokesGrid');
  grid.innerHTML = '';
  document.getElementById('strokeBreakdown').style.display = 'flex';

  const strokes = data.strokes;
  const MINI_SIZE = 48;
  const MINI_PAD = 3;
  const MINI_DRAW = MINI_SIZE - MINI_PAD * 2;
  const MINI_SCALE = MINI_DRAW / ORIG_SIZE;

  strokes.forEach((_, i) => {
    const item = document.createElement('div');
    item.className = 'stroke-item';
    item.id = 'stroke-item-' + i;
    item.onclick = () => jumpToStep(i);

    const num = document.createElement('div');
    num.className = 'stroke-num';
    num.textContent = (i + 1);
    item.appendChild(num);

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + MINI_SIZE + ' ' + MINI_SIZE);
    svg.style.cssText = 'width:' + MINI_SIZE + 'px;height:' + MINI_SIZE + 'px;display:block;';

    const cx = MINI_SIZE / 2;
    svg.innerHTML =
      '<line x1="' + cx + '" y1="0" x2="' + cx + '" y2="' + MINI_SIZE + '" stroke="#e0c9a8" stroke-width="0.5" stroke-dasharray="3,2"/>'
      + '<line x1="0" y1="' + cx + '" x2="' + MINI_SIZE + '" y2="' + cx + '" stroke="#e0c9a8" stroke-width="0.5" stroke-dasharray="3,2"/>';

    const miniTransform = 'translate(' + MINI_PAD + ',' + MINI_PAD + ') scale(' + MINI_SCALE + ') translate(0,' + ORIG_SIZE + ') scale(1,-1)';
    for (let s = 0; s <= i; s++) {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', strokes[s]);
      path.setAttribute('transform', miniTransform);
      path.setAttribute('fill', s === i ? '#c0392b' : '#2c2c2c');
      svg.appendChild(path);
    }

    item.appendChild(svg);
    grid.appendChild(item);
  });
}

function highlightStrokeItem(index) {
  document.querySelectorAll('.stroke-item').forEach(el => el.classList.remove('active'));
  if (index >= 0) {
    const item = document.getElementById('stroke-item-' + index);
    if (item) item.classList.add('active');
  }
}

function quizMode() {
  if (!currentChar || !strokeData) return;
  stopAutoPlay();
  isQuizMode = true;

  clearMainSvg();
  document.getElementById('mainSvg').style.visibility = 'hidden';

  const overlay = document.getElementById('quizOverlay');
  overlay.style.display = 'block';
  document.getElementById('mainPlaceholder').style.display = 'none';

  const old = document.getElementById('quizWriter');
  if (old) old.remove();
  const fresh = document.createElement('div');
  fresh.className = 'writer-target';
  fresh.id = 'quizWriter';
  overlay.insertBefore(fresh, overlay.firstChild);

  quizWriter = HanziWriter.create('quizWriter', currentChar, {
    width: SIZE,
    height: SIZE,
    padding: PAD,
    showOutline: true,
    strokeColor: '#2c2c2c',
    outlineColor: '#ddd',
    radicalColor: '#c0392b',
    highlightColor: '#e74c3c',
    drawingColor: '#c0392b',
    showHintAfterMisses: 3,
    highlightOnComplete: true,
  });

  quizWriter.quiz({
    onComplete: () => {
      setTimeout(() => exitQuizMode(), 1500);
    }
  });
}

function exitQuizMode() {
  isQuizMode = false;
  document.getElementById('quizOverlay').style.display = 'none';
  document.getElementById('mainSvg').style.visibility = 'visible';
  renderMainWriter(false);
  if (quizWriter) {
    try { quizWriter.cancelQuiz(); } catch(e) {}
    quizWriter = null;
  }
}

function resetWriter() {
  stopAutoPlay();
  exitQuizMode();
  if (!currentChar || !strokeData) {
    currentStep = -1;
    clearMainSvg();
    highlightStrokeItem(-1);
    updateStepDisplay();
    return;
  }
  currentStep = totalStrokes - 1;
  renderComplete();
  highlightStrokeItem(-1);
  updateStepDisplay();
}

function renderHistory() {
  const container = document.getElementById('charHistory');
  container.innerHTML = '';
  history.forEach(c => {
    const div = document.createElement('div');
    div.className = 'char-history-item';
    div.textContent = c;
    div.onclick = () => {
      document.getElementById('charInput').value = c;
      loadChar();
    };
    container.appendChild(div);
  });
}

document.getElementById('charInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadChar();
});

document.getElementById('charInput').addEventListener('input', (e) => {
  const val = e.target.value.trim();
  if (val.length === 1 && /[\u4e00-\u9fff]/.test(val)) {
    loadChar();
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    console.log('Service Worker registered', reg.scope);
  }).catch(err => {
    console.log('Service Worker registration failed', err);
  });
}
</script>
